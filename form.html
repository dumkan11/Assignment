<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data <form action=""></form></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Data collection Form</h1>

<div class="form-container">
    <h2>Data Collection</h2>

    <form>

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" name="fullname required">

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter email" name="email">

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g 07012345678" name="phone" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender">
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        
        <option value="female">Female</option>

        </select>
        
<label for="address">Address</label>

        <textarea id="address" id="address"></textarea>

        <button type="submit">Submit</button>



    </form>
</div>


</body>
</html>
